<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de capas ABHA</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f3f6;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d6dbe2;--ac:#0a5f94;--acx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2328;--tx:#eceff3;--mut:#9aa3ad;--bd:#343b44;--ac:#4aa8e0;--acx:#0b1620}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2328;--tx:#eceff3;--mut:#9aa3ad;--bd:#343b44;--ac:#4aa8e0;--acx:#0b1620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",Arial,sans-serif;display:grid;grid-template-columns:380px 1fr;gap:20px;padding:20px;min-height:100vh}
@media(max-width:900px){body{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;align-self:start}
h1{font-size:17px;margin:0 0 12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 0 8px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px;resize:vertical;font-size:12px}
input[type=file]{padding:5px;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--ac);color:var(--acx);font:600 14px inherit;cursor:pointer}
button:disabled{opacity:.6}
#msg{font-size:12px;color:var(--mut);margin-top:8px;min-height:16px}
details{margin-top:14px;border-top:1px solid var(--bd);padding-top:8px}
summary{cursor:pointer;font-size:13px}
#stage{overflow:hidden;align-self:start}
#scaler{transform-origin:top left;width:794px;height:1123px}
/* capa */
#cover{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#000}
#cover>*{position:absolute}
.slot{background-repeat:no-repeat;background-position:center;background-size:contain}
.slot.empty{border:2px dashed #aab;color:#889;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center}
#bg{left:0;top:134px;width:794px;height:746px;background-size:cover;background-color:#8fb4c9}
#bg.empty{border:0;color:#fff}
#mid{left:54px;top:186px;width:676px;display:flex;flex-direction:column;align-items:center;gap:4px}
#obj{width:676px;padding:20px 22px;background:#fff;border-radius:16px;font-weight:700;font-size:19.5px;line-height:1.3;text-align:justify;text-transform:uppercase}
#blue{width:546px;min-height:96px;flex:none;border-radius:8px;background:linear-gradient(90deg,#3a3f58,#0f6b96);color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:14px 24px}
#blue .l1{font-size:15px;font-weight:700;text-transform:uppercase;line-height:1.35}
#blue .l2{font-size:17px;font-weight:700;text-transform:uppercase}
#band{left:0;top:880px;width:794px;height:116px;background:#463d46;color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px}
#band .a{font-size:17px;opacity:.9;text-transform:uppercase}
#band .b{font-size:26px;font-weight:700;text-transform:uppercase}
.tab{width:28px;height:44px}
</style>
</head>
<body>
<div class="panel">
  <h1>Gerador de capas ABHA</h1>
  <label>Produto do contrato</label>
  <select id="pn"><option value="1">PN1</option><option value="2">PN2</option><option value="3">PN3</option></select>
  <div class="row">
    <div><label>Lote</label><input id="lote" placeholder="3"></div>
    <div><label>Produto</label><input id="prod" placeholder="3"></div>
  </div>
  <label>Município</label><input id="mun" placeholder="Tupaciguara">
  <label>Sede e/ou distrito(s)</label><input id="sede" placeholder="Sede urbana, Bálsamo (Distrito)">
  <label>Tipo de serviço</label><input id="tipo" placeholder="Cadastro de rede de água">
  <div class="row">
    <div><label>Ato convocatório nº</label><input id="ato" placeholder="001/2025"></div>
    <div><label>Contrato nº</label><input id="ctr" placeholder="012/2025"></div>
  </div>
  <label>Objeto do contrato (salvo separado para cada PN)</label>
  <textarea id="objeto"></textarea>
  <button id="go">Baixar PNG + PDF</button>
  <div id="msg"></div>
</div>
<div id="stage"><div id="scaler"><div id="cover">
  <div class="tab" style="left:0;top:0;background:#1ea7e8"></div>
  <div class="tab" style="right:0;top:0;background:#1fa84f"></div>
  <div class="tab" style="left:0;bottom:0;background:#ff7a00"></div>
  <div class="tab" style="right:0;bottom:0;background:#ff7a00"></div>
  <div id="abha" class="slot" style="left:444px;top:30px;width:200px;height:76px"></div>
  <div id="cbh" class="slot" style="left:150px;top:30px;width:200px;height:76px"></div>
  <div id="bg" class="slot"></div>
  <div id="mid"><div id="obj"></div>
  <div id="blue"><div class="l1"></div><div class="l2"></div></div></div>
  <div id="band"><div class="a"></div><div class="b"></div></div>
  <div id="planal" class="slot" style="left:247px;top:1010px;width:300px;height:96px"></div>
</div></div></div>

let store={assets:{},obj:{}};
try{const s=localStorage.getItem("capasAbha1");if(s)store=Object.assign(store,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem("capasAbha1",JSON.stringify(store))}catch(e){$("msg").textContent="Não deu pra salvar as imagens neste navegador (espaço cheio)."}}

function setSlot(el,src,label){
  if(src){el.style.backgroundImage="url("+src+")";el.classList.remove("empty");el.textContent=""}
  else{el.style.backgroundImage="";el.classList.add("empty");el.textContent=label}
}
function names(){
  const v=k=>$(k).value.trim();
  const l1=["LOTE "+v("lote"),"PRODUTO "+v("prod"),v("mun"),v("sede")].filter((x,i)=>i<2||x).join(" | ");
  const tipo=v("tipo");
  const file=["LOTE "+v("lote"),"Produto "+v("prod"),v("mun"),v("sede")].filter((x,i)=>i<2||x).join(" | ")+(tipo?" "+tipo.toLowerCase():"");
  return {l1,tipo,file};
}
function render(){
  const pn=$("pn").value;
  setSlot($("abha"),LOGOS.abha,LABELS.abha);
  setSlot($("cbh"),LOGOS["cbh"+pn],"Logo CBH PN"+pn);
  setSlot($("bg"),BG,LABELS.bg);
  setSlot($("planal"),LOGOS.planal,LABELS.planal);
  $("obj").textContent=$("objeto").value;
  const n=names();
  $("blue").children[0].textContent=n.l1;
  $("blue").children[1].textContent=n.tipo;
  let fs=19.5;$("obj").style.fontSize=fs+"px";
  while($("mid").offsetHeight>686&&fs>11){fs-=0.5;$("obj").style.fontSize=fs+"px"}
  const ato=$("ato").value.trim(),ctr=$("ctr").value.trim();
  $("band").children[0].textContent="Ato convocatório ABHA/PN"+pn+" Nº "+ato;
  $("band").children[1].textContent="Contrato ABHA/PN"+pn+" Nº "+ctr;
}
function loadObj(){$("objeto").value=store.obj[$("pn").value]||DEF}
function fit(){
  const w=$("stage").clientWidth,s=Math.min(1,w/794);
  $("scaler").style.transform="scale("+s+")";
  $("stage").style.height=(1123*s)+"px";
}
document.querySelectorAll("input,textarea").forEach(e=>{if(e.type!=="file")e.addEventListener("input",()=>{if(e.id==="objeto"){store.obj[$("pn").value]=e.value;save()}render()})});
$("pn").addEventListener("change",()=>{loadObj();render()});
window.addEventListener("resize",fit);


function fname(){
  const n=names().file.replace(/\s*\|\s*/g," - ").replace(/[\\\/:*?"<>]/g," ").replace(/\s+/g," ").trim();
  return n||"capa";
}
async function saveFile(dl,filename,data){
  if(dl)return dl.save({filename,data});
  const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  await new Promise(r=>setTimeout(r,600));
}
function blobOf(c){return new Promise(r=>c.toBlob(r,"image/png"))}
$("go").addEventListener("click",async()=>{
  const btn=$("go"),msg=$("msg");
  btn.disabled=true;msg.textContent="Gerando...";
  try{
    let dl=null;
    try{dl=(typeof claude!=="undefined")?await claude.use("downloads"):null}catch(e){dl=null}
    const c=await html2canvas($("cover"),{scale:3.125,useCORS:true,backgroundColor:"#fff",onclone:d=>{d.getElementById("scaler").style.transform="none"}});
    const name=fname();
    await saveFile(dl,name+".png",await blobOf(c));
    const pdf=new jspdf.jsPDF({unit:"px",format:[794,1123],orientation:"portrait",compress:true});
    pdf.addImage(c.toDataURL("image/png"),"PNG",0,0,794,1123,undefined,"FAST");
    await saveFile(dl,name+".pdf",pdf.output("blob"));
    msg.textContent="Pronto: "+name;
  }catch(e){msg.textContent=(e&&e.code==="declined")?"Cancelado.":"Erro: "+((e&&e.message)||e)}
  finally{btn.disabled=false}
});
loadObj();render();fit();
</script>
